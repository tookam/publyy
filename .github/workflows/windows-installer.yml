name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GYP_MSVS_VERSION: "2022"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Prepare editor assets
        run: npm run prepare-editor:win

      - name: Build renderer assets
        run: npm run prod

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run packager:win 2>&1 | Tee-Object -FilePath packager-win.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Publyy-Windows-build-log
          path: packager-win.log
          if-no-files-found: ignore

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Publyy-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
